# Site
title:              GotYoo
bio:                'Developer · Builder · Life'
description:        "GotYoo 的个人主页，收录项目、公开文章与 Life 记录。"
locale:             zh_CN
baseurl: "" # the site is served from the domain root
url: "https://lxmhappy.live"

# Comments
disqus_shortname:   default

# Social
douyin:            "https://www.douyin.com/user/self?from_tab_name=main"

# Personal
email:              654601458@qq.com

# Other
background_image:   /images/bg.jpg

defaults:
- scope:
    path: ''
    type: posts
  values:
    permalink: "/blog/:title/"
    layout: article

# Jekyll
permalink:          /blog/:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true

# Gems
gems:
  - jekyll-mentions
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"

jekyll-mentions:
    base_url: https://github.com

# Exclude list
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, _site, CNAME, LICENSE]
