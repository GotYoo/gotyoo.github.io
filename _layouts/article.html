---
layout: interface
---
<article class="article-page">
  <header class="article-hero">
    <div class="article-breadcrumb">
      <a href="{{ '/blog/' | relative_url }}">← 全部公开手记</a>
      <span>/</span>
      <span>{{ page.category | default: "SYSTEM NOTE" }}</span>
    </div>
    <h1 class="article-title">{{ page.title }}</h1>
    <div class="article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>
      <span>•</span>
      <span>深度思考</span>
      <span>•</span>
      <button type="button" style="color:var(--accent-blue);" data-copy-email="{{ site.email }}">联系作者讨论 ↗</button>
    </div>
  </header>

  <div class="article-layout">
    <div class="markdown-content">
      {{ content }}
    </div>

    <div class="resume-download-card" style="margin-top: 48px;">
      <div class="resume-download-info">
        <h3>把真实的思考与工程选择记录下来，持续迭代。</h3>
        <p>欢迎就本文提到的架构权衡、技术决策或代码实现展开交流探讨。</p>
      </div>
      <div class="resume-actions-group">
        <a href="{{ '/blog/' | relative_url }}" class="btn-copy-email">
          <span>← 返回手记列表</span>
        </a>
        <button type="button" class="btn-primary-action" data-copy-email="{{ site.email }}">
          <span>联系作者交流 ↗</span>
        </button>
      </div>
    </div>
  </div>
</article>
