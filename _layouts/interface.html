<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06090d">
  <meta name="description" content="{{ page.description }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.url }}/images/bg.jpg">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/icon/favicon-32x32.png' | relative_url }}" sizes="32x32">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
  <title>{{ page.title }} · GotYoo</title>
</head>
<body data-page="{{ page.page_key }}" class="is-loading">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="boot" aria-hidden="true"><div class="boot__core"><span>GY</span><i></i></div><p>LOADING {{ page.page_key | upcase }}</p></div>
  <div class="page-grid" aria-hidden="true"></div><div class="scroll-progress" aria-hidden="true"><i></i></div>
  <div class="cursor cursor--dot" aria-hidden="true"></div><div class="cursor cursor--ring" aria-hidden="true"></div>
  <header class="site-header is-scrolled" data-header>
    <a class="brand magnetic" href="{{ '/' | relative_url }}"><span class="brand__mark">GY</span><span class="brand__text">GOTYOO<small>PERSONAL INTERFACE</small></span></a>
    <nav class="site-nav" aria-label="主导航"><a data-nav="home" href="{{ '/' | relative_url }}">首页</a><a data-nav="projects" href="{{ '/projects/' | relative_url }}">项目</a><a href="{{ '/' | relative_url }}#experience">经历</a><a data-nav="blog" href="{{ '/blog/' | relative_url }}">文章</a><a data-nav="life" href="{{ '/life/' | relative_url }}">Life</a><a data-nav="about" href="{{ '/about/' | relative_url }}">关于</a></nav>
    <button class="command-trigger magnetic" type="button" data-command-open aria-label="打开快速导航"><kbd>⌘</kbd><kbd>K</kbd><span>导航</span></button>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div><span class="brand__mark">GY</span><p>GotYoo · Personal Interface</p></div><nav><a href="{{ '/projects/' | relative_url }}">Projects</a><a href="{{ '/resume/' | relative_url }}">Resume</a><a href="{{ '/blog/' | relative_url }}">Blog</a><a href="{{ '/life/' | relative_url }}">Life</a><a href="https://github.com/GotYoo" target="_blank" rel="noopener">GitHub</a></nav><p>© <span data-year></span> · BUILT WITH INTENT</p></footer>
  <div class="command" data-command hidden><button class="command__backdrop" type="button" data-command-close aria-label="关闭导航"></button><div class="command__panel" role="dialog" aria-modal="true" aria-labelledby="command-title"><div class="command__head"><span id="command-title">QUICK NAVIGATION</span><kbd>ESC</kbd></div><div class="command__list"><a href="{{ '/' | relative_url }}"><b>01</b><span>首页<small>Home</small></span><i>↗</i></a><a href="{{ '/projects/' | relative_url }}"><b>02</b><span>项目<small>Projects</small></span><i>↗</i></a><a href="{{ '/resume/' | relative_url }}"><b>03</b><span>简历<small>Resume</small></span><i>↗</i></a><a href="{{ '/blog/' | relative_url }}"><b>04</b><span>文章<small>Writing</small></span><i>↗</i></a><a href="{{ '/life/' | relative_url }}"><b>05</b><span>生活<small>Life</small></span><i>↗</i></a><a href="{{ '/about/' | relative_url }}"><b>06</b><span>关于<small>About</small></span><i>↗</i></a></div></div></div>
  <div class="hover-preview" data-hover-preview aria-hidden="true"><div class="hover-preview__visual"></div><span></span><p></p></div>
  <div class="route-curtain" aria-hidden="true"><i></i><i></i><span>OPENING NEXT VIEW</span></div>
</body>
</html>
