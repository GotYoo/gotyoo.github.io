<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f6fc">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title }} · GotYoo">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.url }}/images/air-sky.jpg">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/icon/favicon-32x32.png' | relative_url }}" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
  <title>{{ page.title }} · GotYoo</title>
</head>
<body data-page="{{ page.page_key }}" class="air-body">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="air-bg" aria-hidden="true"></div>
  <div class="air-progress" aria-hidden="true"><i data-read-bar></i></div>

  <header class="air-header" data-header>
    <div class="air-header__inner">
      <a class="air-brand" href="{{ '/' | relative_url }}">
        <span class="air-brand__logo">GY</span>
        <span class="air-brand__name">GotYoo <small class="air-brand__tag">sys</small></span>
      </a>
      <nav class="air-nav" aria-label="主导航">
        <a data-nav="home" href="{{ '/' | relative_url }}">首页</a>
        <a data-nav="projects" href="{{ '/projects/' | relative_url }}">项目</a>
        <a data-nav="blog" href="{{ '/blog/' | relative_url }}">文章</a>
        <a data-nav="life" href="{{ '/life/' | relative_url }}">生活</a>
        <a data-nav="resume" href="{{ '/resume/' | relative_url }}">简历</a>
        <a data-nav="about" href="{{ '/about/' | relative_url }}">关于</a>
      </nav>
      <div class="air-header__actions">
        <a class="air-btn air-btn--contact" href="mailto:654601458@qq.com">联系作者 ↗</a>
      </div>
    </div>
  </header>

  <main id="main" class="air-main">
    {{ content }}
  </main>

  <footer class="air-footer">
    <div class="air-footer__inner">
      <div class="air-footer__brand">
        <a class="air-brand" href="{{ '/' | relative_url }}">
          <span class="air-brand__logo">GY</span>
          <span class="air-brand__name">GotYoo</span>
        </a>
        <p>AI Agent · RAG · Engineering & Aesthetics</p>
      </div>
      <nav class="air-footer__nav" aria-label="页脚导航">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/projects/' | relative_url }}">项目</a>
        <a href="{{ '/blog/' | relative_url }}">文章</a>
        <a href="{{ '/life/' | relative_url }}">生活</a>
        <a href="{{ '/resume/' | relative_url }}">简历</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/GotYoo" target="_blank" rel="noopener">GitHub ↗</a>
      </nav>
      <div class="air-footer__meta">
        <span>© <span data-year></span> GotYoo (吴汉卿). All rights reserved.</span>
        <span class="air-footer__badge">Air Design System</span>
      </div>
    </div>
  </footer>
</body>
</html>
